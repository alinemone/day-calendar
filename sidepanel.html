<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>روز · تقویم آرام شما</title><link rel="stylesheet" href="styles.css"><script type="module" src="app.js"></script></head>
<body><main>
  <div id="home-screen">
  <header class="today-header" aria-label="تاریخ امروز"><h1><img class="date-rosette" src="assets/rosette.svg" width="24" height="24" alt="" aria-hidden="true"><span class="date-heading"><span id="today-weekday"></span> <span id="today-date"></span></span></h1><button id="open-alerts" class="icon-button" aria-label="نمایش همه یادآورها"><img src="assets/bell.svg" width="18" height="18" alt=""><span id="alert-count" class="badge" hidden></span></button></header>
  <section class="calendar-section" aria-label="تقویم"><div class="section-heading"><h2><button id="month-title" type="button" aria-expanded="false" aria-controls="month-picker" title="انتخاب ماه و سال"></button></h2><div class="navigation"><button id="prev" class="icon-button" aria-label="ماه قبل">‹</button><button id="today" class="text-button">امروز</button><button id="next" class="icon-button" aria-label="ماه بعد">›</button></div></div><div id="month-picker" class="month-picker" hidden><label for="jump-year">سال</label><select id="jump-year"></select><div id="jump-months" class="month-grid" aria-label="انتخاب ماه"></div></div><div class="weekdays" aria-hidden="true"><span>ش</span><span>ی</span><span>د</span><span>س</span><span>چ</span><span>پ</span><span>ج</span></div><div id="calendar" class="calendar" aria-label="روزهای ماه"></div><div class="legend"><span><i class="note-dot"></i>یادداشت</span><span><i class="reminder-dot"></i>یادآور</span><button id="week-toggle" class="text-button">نمای هفتگی</button></div></section>
  <div id="day-events" aria-live="polite"></div><nav class="tabs" aria-label="ابزارها"><button class="active" data-tab="day" aria-current="page">روز من</button><button data-tab="convert">تبدیل تاریخ</button></nav>
  <section id="day-panel" class="panel"><div class="section-heading"><h2 id="selected-title"></h2><span class="small" id="selected-relative"></span></div><form id="note-form"><label class="sr-only" for="note">یادداشت</label><textarea id="note" rows="3" maxlength="10000" placeholder="چیزی بنویسید…"></textarea><div class="composer-tools"><label class="remind-switch"><input id="remind-toggle" type="checkbox"><span>یادآوری</span></label><div id="reminder-time-row" hidden><div class="time-24" dir="ltr"><select id="reminder-hour" aria-label="ساعت یادآوری، ۲۴ ساعته"></select><span aria-hidden="true">:</span><select id="reminder-minute" aria-label="دقیقه یادآوری"></select></div><input id="reminder-time" type="hidden" value="09:00"></div><button id="cancel-note" type="button" class="text-button" hidden>انصراف</button><button class="primary" type="submit">ثبت</button></div><details id="repeat-options"><summary>تکرار</summary><label for="repeat-mode">تکرار</label><select id="repeat-mode"><option value="none">فقط همین روز</option><option value="daily">هر روز · روزهای پشت‌سرهم</option><option value="weekly">روزهای مشخص هفته</option></select><div id="repeat-days" hidden></div><div id="repeat-end-row" hidden><label for="repeat-end">پایان</label><select id="repeat-end"><option value="30">پس از ۳۰ روز</option><option value="7">پس از ۷ روز</option><option value="90">پس از ۹۰ روز</option><option value="custom">تعداد روز دلخواه</option><option value="forever">بدون پایان</option></select><input id="repeat-duration" type="number" min="1" max="36500" value="30" aria-label="تعداد روز از شروع" hidden><p class="small">از روز انتخاب‌شده؛ شامل روز شروع</p></div><p id="repeat-edit-hint" class="small" hidden></p></details><span class="small" id="note-status" role="status"></span></form><div id="day-notes" aria-live="polite"></div></section>
  <section id="convert-panel" class="panel" hidden><h2>یک تاریخ، دو تقویم</h2><form id="convert-form"><label for="calendar-type">تبدیل از</label><select id="calendar-type"><option value="persian">شمسی به میلادی</option><option value="gregorian">میلادی به شمسی</option></select><div class="date-selectors"><div><label for="convert-year">سال</label><select id="convert-year" required></select></div><div><label for="convert-month">ماه</label><select id="convert-month" required></select></div><div><label for="convert-day">روز</label><select id="convert-day" required></select></div></div><button class="primary" type="submit">تبدیل تاریخ</button></form><output id="convert-result" aria-live="polite"></output><button id="go-converted" class="text-button accent" hidden>رفتن به این روز در تقویم ←</button></section></div>
  <section id="alerts-panel" aria-label="اعلان‌ها" hidden><header class="alerts-header"><button id="back-home" type="button" aria-label="بازگشت به صفحه اصلی">› <span>بازگشت</span></button><h1>اعلان‌ها</h1></header><div class="reminder-filters" role="tablist" aria-label="یادآورها"><button id="due-tab" type="button" role="tab" aria-controls="all-reminders" data-reminder-filter="due" aria-selected="true">موعدرسیده</button><button id="upcoming-tab" type="button" role="tab" aria-controls="all-reminders" data-reminder-filter="upcoming" aria-selected="false" tabindex="-1">پیش‌رو<span id="upcoming-count"></span></button></div><div id="all-reminders" role="tabpanel" aria-labelledby="due-tab"></div></section>
  <footer class="app-footer" aria-label="پیوندها و ابزارها"><span>روز · تقویم شمسی</span><nav><a href="https://github.com/alinemone/day-calendar" target="_blank" rel="noreferrer">گیت</a><span class="footer-placeholder">دونیت</span><button id="clear-events" class="footer-trash" title="پاک کردن کش مناسبت‌ها" aria-label="پاک کردن کش مناسبت‌ها"><span class="trash-icon" aria-hidden="true"></span></button></nav></footer>
  <dialog id="series-scope"><form method="dialog"><h2 id="scope-title">تغییر تکرار</h2><button value="one" class="primary">فقط این روز</button><button value="all" class="text-button">همهٔ تکرارها</button><button value="cancel" class="text-button">انصراف</button></form></dialog><div id="message" role="status" aria-live="polite" hidden></div>
</main></body></html>
